<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raindrop Random Bookmarks</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #7dd3fc;
      letter-spacing: -0.5px;
    }

    header p {
      color: #64748b;
      margin-top: 0.4rem;
      font-size: 0.9rem;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls label {
      font-size: 0.875rem;
      color: #94a3b8;
    }

    .controls input[type="number"] {
      width: 4rem;
      padding: 0.45rem 0.6rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 0.875rem;
      text-align: center;
    }

    .controls input[type="number"]:focus {
      outline: 2px solid #7dd3fc;
      border-color: transparent;
    }

    button#fetch {
      padding: 0.5rem 1.4rem;
      border-radius: 8px;
      border: none;
      background: #0ea5e9;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button#fetch:hover { background: #38bdf8; }
    button#fetch:disabled { background: #334155; cursor: not-allowed; }

    #status {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 1.5rem;
      min-height: 1.2em;
    }

    #cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 960px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.25rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.4;
    }

    .card-link a {
      font-size: 0.8rem;
      color: #38bdf8;
      text-decoration: none;
      word-break: break-all;
    }

    .card-link a:hover { text-decoration: underline; }

    .card-excerpt {
      font-size: 0.83rem;
      color: #94a3b8;
      line-height: 1.5;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.2rem;
      align-items: center;
    }

    .tag {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 999px;
      font-size: 0.72rem;
      padding: 0.15rem 0.6rem;
      color: #7dd3fc;
    }

    .date {
      margin-left: auto;
      font-size: 0.72rem;
      color: #475569;
    }

    .empty {
      color: #475569;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌧 Raindrop Random Bookmarks</h1>
    <p>Rediscover something from your collection</p>
  </header>

  <div class="controls">
    <label for="count">How many?</label>
    <input type="number" id="count" value="1" min="1" max="20" />
    <button id="fetch" onclick="fetchBookmarks()">Surprise me</button>
  </div>

  <div id="status"></div>
  <div id="cards"></div>

  <script>
    async function fetchBookmarks() {
      const btn = document.getElementById("fetch");
      const status = document.getElementById("status");
      const cards = document.getElementById("cards");
      const count = Math.max(1, Math.min(20, parseInt(document.getElementById("count").value) || 1));

      btn.disabled = true;
      status.textContent = "Fetching…";
      cards.innerHTML = "";

      try {
        const res = await fetch(`/api/random?count=${count}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const bookmarks = await res.json();

        if (!bookmarks.length) {
          cards.innerHTML = `<p class="empty">No bookmarks found.</p>`;
          status.textContent = "";
          return;
        }

        status.textContent = `Showing ${bookmarks.length} random bookmark${bookmarks.length > 1 ? "s" : ""}`;

        for (const b of bookmarks) {
          const excerpt = b.excerpt
            ? `<p class="card-excerpt">${escHtml(b.excerpt.slice(0, 220))}${b.excerpt.length > 220 ? "…" : ""}</p>`
            : "";

          const tags = b.tags.length
            ? b.tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join("")
            : "";

          const date = b.created ? `<span class="date">${b.created}</span>` : "";

          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <p class="card-title">${escHtml(b.title)}</p>
            <div class="card-link"><a href="${escHtml(b.link)}" target="_blank" rel="noopener">${escHtml(b.link)}</a></div>
            ${excerpt}
            ${(tags || date) ? `<div class="card-meta">${tags}${date}</div>` : ""}
          `;
          cards.appendChild(card);
        }
      } catch (err) {
        status.textContent = "Error: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Auto-fetch on load
    fetchBookmarks();
  </script>
</body>
</html>
